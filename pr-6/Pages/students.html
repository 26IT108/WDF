<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Students</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <img src="../images/logo.png" alt="StudentHub Logo">
            <div>
                <h1>StudentHub</h1>
                <p>Student Information</p>
            </div>
        </div>
    </header>

    <nav aria-label="Main Navigation">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="attendance.html">Attendance</a>
        <a href="assignment.html">Assignments</a>
        <a href="events.html">Events</a>
        <a href="students.html">Students</a>
        <a href="profile.html">Profile</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section>
            <h2>Student Information</h2>

            <div class="data-controls">
                <div>
                    <label for="studentSearch">Search Students:</label>
                    <input type="text" id="studentSearch" placeholder="Search by name">
                </div>

                <div>
                    <label for="studentCourse">Course:</label>
                    <select id="studentCourse">
                        <option value="all">All Courses</option>
                        <option value="B.Tech IT">B.Tech IT</option>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>
                </div>

                <div>
                    <label for="studentYear">Year:</label>
                    <select id="studentYear">
                        <option value="all">All Years</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>

                <div>
                    <label for="studentSort">Sort:</label>
                    <select id="studentSort">
                        <option value="default">Default</option>
                        <option value="az">Name A-Z</option>
                        <option value="za">Name Z-A</option>
                        <option value="yearAsc">Year Low-High</option>
                        <option value="yearDesc">Year High-Low</option>
                    </select>
                </div>
            </div>

            <p id="studentLoading">Loading students...</p>
            <p id="studentError" class="error"></p>
            <div id="studentList"></div>

            <div class="pagination">
                <button id="studentPrev">Previous</button>
                <span id="studentPage">Page 1</span>
                <button id="studentNext">Next</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub. All rights reserved.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
