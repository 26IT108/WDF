<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - StudentHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <div class="logo-area">
            <img src="../images/logo.png" alt="StudentHub Logo">

            <div>
                <h1>StudentHub</h1>
                <p>Your Student Portal</p>
            </div>
        </div>
    </header>


    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="attendance.html">Attendance</a>
        <a href="assignment.html">Assignment</a>
        <a href="events.html">Events</a>
        <a href="students.html">Students</a>
        <a href="profile.html">Profile</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
    </nav>


    <main>

        <section class="form-container">

            <h2>Student Registration</h2>

            <p>Create your StudentHub account.</p>


            <form id="registerForm" action="../php/process_registration.php" method="post">

                <!-- Full Name -->
                <label for="name">Full Name:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                    aria-describedby="nameError">

                <small id="nameError" class="error"></small>


                <!-- Email -->
                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                    aria-describedby="emailError">

                <small id="emailError" class="error"></small>


                <!-- Student ID -->
                <label for="studentId">Student ID:</label>

                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    placeholder="Enter student ID"
                    required
                    aria-describedby="studentIdError">

                <small id="studentIdError" class="error"></small>


                <!-- Mobile -->
                <label for="mobile">Mobile Number:</label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                    required
                    aria-describedby="mobileError">

                <small id="mobileError" class="error"></small>


                <!-- Course -->
                <label for="course">Course:</label>

                <select id="course" name="course" required>

                    <option value="">Select Course</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="BCA">BCA</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="MCA">MCA</option>

                </select>

                <small id="courseError" class="error"></small>


                <!-- Year -->
                <label for="year">Year:</label>

                <select id="year" name="year" required>

                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>

                </select>

                <small id="yearError" class="error"></small>


                <!-- Gender -->
                <label>Gender:</label>

                <div class="gender-options">

                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>

                </div>

                <small id="genderError" class="error"></small>


                <!-- Password -->
                <label for="password">Password:</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    aria-describedby="passwordError">

                <div class="password-bar">
                    <div id="strengthFill"></div>
                </div>

                <p id="passwordStrength"></p>

                <small id="passwordError" class="error"></small>


                <!-- Confirm Password -->
                <label for="confirmPassword">Confirm Password:</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Enter password again"
                    required
                    aria-describedby="confirmPasswordError">

                <small id="confirmPasswordError" class="error"></small>


                <!-- Terms -->
                <div class="terms">

                    <label>
                        <input
                            type="checkbox"
                            id="terms"
                            name="terms">

                        I agree to the Terms and Conditions
                    </label>

                </div>

                <small id="termsError" class="error"></small>


                <!-- Submit -->
                <button type="submit">Create Account</button>

                <p id="successMessage" class="success"></p>

            </form>

            <p class="registration-view-link">
                <a href="../php/view_registrations.php">View Registered Students</a>
            </p>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 StudentHub. All rights reserved.</p>
    </footer>


    <!-- Existing JavaScript -->
    <script src="../js/script.js"></script>

    <!-- Registration validation JavaScript -->
    <script src="../js/register-validation.js"></script>

</body>

</html>
